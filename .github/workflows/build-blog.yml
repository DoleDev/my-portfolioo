name: Build Blog

on:
  push:
    paths:
      - 'blog/posts/**'
      - 'scripts/build-blog.js'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build blog.json
        run: node scripts/build-blog.js

      - name: Commit and push updated blog.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/blog.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: rebuild blog.json from markdown" && git push)
